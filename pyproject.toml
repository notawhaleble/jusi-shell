[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi-shell"
version = "0.2.0"
description = "Shell plugin for Jusi"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jusi contributors" }
]
dependencies = [
  "jusi>=1.0,<2",
]

[project.entry-points."jusi.plugins.v1"]
jusi_shell = "jusi_shell.catalog:catalog_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi_shell"]
