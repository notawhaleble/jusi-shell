[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi-shell"
version = "0.1.0"
description = "Shell plugin for Jusi"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jusi contributors" }
]
dependencies = [
  "jusi",
]

[project.entry-points."jusi.display_handlers"]
shell = "jusi_shell.plugin:display_handler_specs"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi_shell"]
